[package]
name = "vocalcode-android"
edition.workspace = true
version.workspace = true

[lib]
name = "vocalcode"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
image = { version = "0.25", default-features = false }
vocalcode-core = { path = "../vocalcode-core" }
vocalcode-audio = { path = "../vocalcode-audio", default-features = false }
