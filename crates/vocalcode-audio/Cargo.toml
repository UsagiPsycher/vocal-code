[package]
name = "vocalcode-audio"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
candle-core = "0.9.1"
moshi = "0.6.4"
candle-nn = "0.9.1"
symphonia = { version = "0.5.4", features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac", "ogg", "vorbis"], optional = true }
rubato = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }
ureq = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["io"]
# lecture/écriture de fichiers audio et téléchargement des poids (PC)
io = ["dep:symphonia", "dep:rubato", "dep:hound", "dep:ureq", "dep:sha2"]
